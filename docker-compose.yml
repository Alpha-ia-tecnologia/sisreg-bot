services:
  sisreg-bot:
    build: .
    ports:
      - "${PORT}:8080"
    env_file:
      - .env
    volumes:
      - bot-data:/app/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - bridge
      - easypanel
    shm_size: "256mb"
    restart: unless-stopped
volumes:
  bot-data:
networks:
  default:
    external: true
    name: easypanel-sisreg-bot
  bridge:
    external: true
    name: bridge
  easypanel:
    external: true
